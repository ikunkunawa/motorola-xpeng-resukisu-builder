name: Build ReSukiSU kernel

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: "Official boot.img URL (leave empty to use repo variable BOOT_URL)"
        required: false
        type: string

env:
  LOS_BRANCH: lineage-23.2
  KSU_REF: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          BOOT_URL: ${{ inputs.boot_url || vars.BOOT_URL }}
        run: bash scripts/build.sh

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-ksu
          path: boot-ksu.img
          compression-level: 0
